<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Isha Deo · Coming soon</title>
  <meta name="description" content="Isha Deo, copywriter and creative strategist. A new portfolio is on its way.">
  <meta property="og:title" content="Isha Deo · Coming soon">
  <meta property="og:description" content="Copywriter and creative strategist. A new portfolio is on its way.">
  <meta property="og:image" content="https://lifewithisha.com/assets/coming-soon/isha.jpg">
  <link rel="canonical" href="https://lifewithisha.com/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f6f1e8;
      --ink: #1b1918;
      --pink: #ff2bd6;
      --orange: #ff7a00;
      --lime: #8fe000;
      --cyan: #00bfff;
      --violet: #8a2bff;
      --red: #ff2e5b;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--paper) url("assets/coming-soon/paper.jpg") center / cover fixed; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); background: transparent;
      font: 400 17px/1.55 "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      display: grid; place-items: center; padding: 24px 16px;
    }
    main { display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Stage: cutout + doodles + star stickers share one coordinate system */
    .stage { width: min(320px, 70vw, 46vh); aspect-ratio: 4 / 5; }
    .stage svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .me { animation: settle 1s cubic-bezier(.2,.8,.2,1) both; transform-origin: 500px 1000px; }
    .doodles path, .doodles circle {
      fill: none; stroke: var(--c, var(--pink)); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1;
      animation: draw var(--t, .8s) cubic-bezier(.6,.1,.3,1) forwards;
      animation-delay: calc(.6s + var(--d, 0s));
    }
    .doodles .thin { stroke-width: 6.5; }
    .sticker {
      transform-box: fill-box; transform-origin: center;
      opacity: 0; animation: pop .55s cubic-bezier(.3,1.6,.5,1) forwards, wiggle 1.6s steps(4) infinite;
      animation-delay: var(--d, 1s), calc(var(--d, 1s) + .6s);
      filter: drop-shadow(0 6px 6px rgba(60, 40, 30, .18));
    }
    .scribble-name {
      font-family: "Permanent Marker", cursive; font-size: 118px; fill: var(--pink);
      opacity: 0; animation: fade .5s ease-out forwards; animation-delay: 4.3s;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes pop { 0% { opacity: 0; transform: scale(.2) rotate(-25deg); } 100% { opacity: 1; transform: scale(1) rotate(var(--r, 0deg)); } }
    @keyframes wiggle {
      0%   { transform: scale(1) rotate(var(--r, 0deg)); }
      25%  { transform: scale(1.03) rotate(calc(var(--r, 0deg) + 4deg)); }
      50%  { transform: scale(1) rotate(calc(var(--r, 0deg) - 2deg)); }
      75%  { transform: scale(1.02) rotate(calc(var(--r, 0deg) + 2deg)); }
      100% { transform: scale(1) rotate(var(--r, 0deg)); }
    }
    @keyframes settle { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }

    .soon { margin: 6px 0 0; font: italic 400 clamp(30px, 4vw, 40px)/1 "Instrument Serif", Georgia, serif; letter-spacing: .01em; }
    .links { display: flex; gap: 12px; }
    .btn {
      display: inline-block; min-width: 128px; padding: 12px 24px; border-radius: 999px;
      font: 500 15px/1.2 "Inter Tight", system-ui, sans-serif; text-decoration: none;
      color: #fff; background: var(--pink); border: 2px solid var(--pink);
      box-shadow: 0 0 0 0 rgba(255, 43, 214, .5), 0 8px 22px rgba(255, 43, 214, .35);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { transform: translateY(-2px) rotate(-1.5deg); box-shadow: 0 0 0 6px rgba(255, 43, 214, .18), 0 10px 26px rgba(255, 43, 214, .45); }
    .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      .me, .scribble-name { animation: none; opacity: 1; }
      .doodles path, .doodles circle { animation: none; stroke-dashoffset: 0; }
      .sticker { animation: none; opacity: 1; transform: rotate(var(--r, 0deg)); }
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="stage">
      <svg viewBox="0 0 1000 1250" role="img" aria-labelledby="pic-title">
        <title id="pic-title">Isha Deo, black and white cutout on watercolour paper, surrounded by neon doodles of coffee, a cat, a pencil and a flower, and animal-print star stickers</title>
        <defs>
          <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="n">
              <animate class="boil-anim" attributeName="seed" values="1;3;5;7" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
          </filter>
          <pattern id="zebra" patternContentUnits="objectBoundingBox" width="1" height="1"><image href="assets/coming-soon/tex-zebra.jpg" width="1" height="1" preserveAspectRatio="xMidYMid slice"/></pattern>
          <pattern id="leopard" patternContentUnits="objectBoundingBox" width="1" height="1"><image href="assets/coming-soon/tex-leopard.jpg" width="1" height="1" preserveAspectRatio="xMidYMid slice"/></pattern>
          <pattern id="cheetah" patternContentUnits="objectBoundingBox" width="1" height="1"><image href="assets/coming-soon/tex-cheetah.jpg" width="1" height="1" preserveAspectRatio="xMidYMid slice"/></pattern>
          <pattern id="snow" patternContentUnits="objectBoundingBox" width="1" height="1"><image href="assets/coming-soon/tex-snow.jpg" width="1" height="1" preserveAspectRatio="xMidYMid slice"/></pattern>
          <!-- shapes, centred on 0,0, radius 50 -->
          <path id="star5" d="M0 -50 L12 -16 L48 -15 L19 7 L29 42 L0 21 L-29 42 L-19 7 L-48 -15 L-12 -16 Z"/>
          <path id="burst8" d="M0 -50 L11 -22 L35 -35 L25 -10 L50 0 L25 10 L35 35 L11 22 L0 50 L-11 22 L-35 35 L-25 10 L-50 0 L-25 -10 L-35 -35 L-11 -22 Z"/>
          <path id="burst10" d="M0 -50 L9 -24 L29 -40 L24 -13 L48 -15 L29 4 L48 15 L24 13 L29 40 L9 24 L0 50 L-9 24 L-29 40 L-24 13 L-48 15 L-29 4 L-48 -15 L-24 -13 L-29 -40 L-9 -24 Z"/>
        </defs>

        <image class="me" href="assets/coming-soon/isha-cutout.webp" x="79" y="266" width="842" height="984"/>

        <g class="doodles" filter="url(#boil)">
          <!-- swirl over the top -->
          <path pathLength="1" style="--c:var(--violet);--d:0s;--t:1.1s" d="M70 205 C 150 110, 240 190, 330 120 S 520 60, 610 120 S 780 190, 860 115 S 960 100, 975 150"/>
          <!-- coffee cup with steam -->
          <path pathLength="1" style="--c:var(--orange);--d:.9s" d="M40 430 L180 430 L162 560 Q 110 595 58 560 Z"/>
          <path pathLength="1" style="--c:var(--orange);--d:1.2s;--t:.5s" d="M178 455 C 235 452, 238 525, 166 522"/>
          <path pathLength="1" style="--c:var(--orange);--d:1.35s;--t:.4s" d="M22 600 Q 110 632 200 600"/>
          <path pathLength="1" class="thin" style="--c:var(--cyan);--d:1.5s;--t:.6s" d="M85 405 C 62 375, 105 355, 84 325 C 68 300, 100 285, 88 258"/>
          <path pathLength="1" class="thin" style="--c:var(--cyan);--d:1.65s;--t:.6s" d="M135 405 C 112 375, 155 355, 134 325 C 118 300, 150 285, 138 258"/>
          <!-- pencil -->
          <path pathLength="1" style="--c:var(--lime);--d:1.9s;--t:.7s" d="M20 700 L195 665 L203 707 L28 742 Z"/>
          <path pathLength="1" style="--c:var(--lime);--d:2.2s;--t:.4s" d="M195 665 L252 682 L203 707"/>
          <path pathLength="1" class="thin" style="--c:var(--lime);--d:2.35s;--t:.3s" d="M60 693 L68 734"/>
          <path pathLength="1" class="thin" style="--c:var(--pink);--d:2.45s;--t:.6s" d="M255 690 C 285 700, 280 735, 255 740 C 230 745, 240 775, 270 780"/>
          <!-- cat, top right -->
          <path pathLength="1" style="--c:var(--pink);--d:2.5s;--t:1s" d="M790 330 C 778 275, 796 237, 812 223 L 802 165 L 844 205 Q 866 199 888 205 L 930 165 L 920 223 C 940 237, 952 277, 936 330 C 916 377, 812 377, 790 330 Z"/>
          <path pathLength="1" class="thin" style="--c:var(--pink);--d:3.2s;--t:.2s" d="M832 277 L832 291"/>
          <path pathLength="1" class="thin" style="--c:var(--pink);--d:3.25s;--t:.2s" d="M894 277 L894 291"/>
          <path pathLength="1" class="thin" style="--c:var(--pink);--d:3.3s;--t:.25s" d="M853 309 L863 318 L873 309"/>
          <path pathLength="1" class="thin" style="--c:var(--pink);--d:3.4s;--t:.4s" d="M782 309 L740 299 M782 325 L742 333 M944 309 L986 299 M944 325 L984 333"/>
          <!-- flower, right -->
          <circle pathLength="1" style="--c:var(--red);--d:2.1s;--t:.5s" cx="880" cy="500" r="26"/>
          <path pathLength="1" style="--c:var(--red);--d:2.35s;--t:.9s" d="M880 474 C 845 415, 915 415, 880 474 M906 500 C 965 465, 965 535, 906 500 M880 526 C 915 585, 845 585, 880 526 M854 500 C 795 535, 795 465, 854 500"/>
          <path pathLength="1" style="--c:var(--lime);--d:2.9s;--t:.7s" d="M880 555 C 860 625, 905 680, 878 745"/>
          <path pathLength="1" class="thin" style="--c:var(--lime);--d:3.3s;--t:.4s" d="M884 650 C 930 615, 955 650, 892 672"/>
          <!-- little sparkles -->
          <path pathLength="1" class="thin" style="--c:var(--cyan);--d:3.5s;--t:.35s" d="M700 230 L700 280 M675 255 L725 255"/>
          <path pathLength="1" class="thin" style="--c:var(--orange);--d:3.6s;--t:.35s" d="M250 300 L250 342 M229 321 L271 321"/>
          <!-- underline under the name -->
          <path pathLength="1" style="--c:var(--pink);--d:4.6s;--t:.6s" d="M560 1225 C 650 1205, 800 1212, 960 1188"/>
        </g>

        <!-- animal-print star stickers -->
        <g transform="translate(95 125) scale(2.1)"><g class="sticker" style="--d:1.6s;--r:-12deg">
          <use href="#burst10" fill="url(#zebra)" stroke="#fff6ef" stroke-width="3"/>
        </g></g>
        <g transform="translate(955 815) scale(1.8)"><g class="sticker" style="--d:2.0s;--r:10deg">
          <use href="#star5" fill="#ff5fd2" stroke="#fff6ef" stroke-width="3"/>
          <use href="#star5" fill="url(#snow)" transform="scale(.62)"/>
        </g></g>
        <g transform="translate(80 910) scale(2.2)"><g class="sticker" style="--d:2.4s;--r:-8deg">
          <use href="#star5" fill="url(#leopard)" stroke="#fff6ef" stroke-width="3"/>
        </g></g>
        <g transform="translate(610 90) scale(1.45)"><g class="sticker" style="--d:2.8s;--r:14deg">
          <use href="#burst8" fill="#ff7ad9" stroke="#fff6ef" stroke-width="3"/>
          <use href="#burst8" fill="url(#cheetah)" transform="scale(.7)"/>
        </g></g>
        <g transform="translate(900 1090) scale(2.2)"><g class="sticker" style="--d:3.2s;--r:-6deg">
          <use href="#star5" fill="url(#cheetah)" stroke="#fff6ef" stroke-width="3"/>
          <use href="#star5" fill="#ff4fcf" transform="scale(.38)"/>
        </g></g>
        <g transform="translate(200 1160) scale(1.7)"><g class="sticker" style="--d:3.6s;--r:18deg">
          <use href="#star5" fill="url(#snow)" stroke="#fff6ef" stroke-width="3"/>
          <use href="#star5" fill="#ff8fe0" transform="scale(.6)"/>
        </g></g>
        <g transform="translate(345 55) scale(1.15)"><g class="sticker" style="--d:4.0s;--r:-16deg">
          <use href="#burst8" fill="url(#leopard)" stroke="#fff6ef" stroke-width="3"/>
          <use href="#star5" fill="#ff4fcf" transform="scale(.4)"/>
        </g></g>

        <text class="scribble-name" x="600" y="1190" transform="rotate(-6 760 1170)" filter="url(#boil)">isha!</text>
      </svg>
    </div>

    <h1 class="visually-hidden">Isha Deo</h1>
    <p class="soon">coming soon</p>
    <div class="links">
      <a class="btn" href="assets/Isha_Deo_Resume.pdf" target="_blank" rel="noopener">Resume</a>
      <a class="btn" href="mailto:deoisha278@gmail.com">Email</a>
    </div>
  </main>
  <script>
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.querySelectorAll('.boil-anim').forEach((a) => a.remove());
    }
  </script>
</body>
</html>

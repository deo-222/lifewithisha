<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isha Deo · Coming soon</title>
  <meta name="description" content="Isha Deo, copywriter and creative strategist. A new portfolio is on its way.">
  <meta property="og:title" content="Isha Deo · Coming soon">
  <meta property="og:description" content="Copywriter and creative strategist. A new portfolio is on its way.">
  <meta property="og:image" content="https://lifewithisha.com/assets/coming-soon/isha.jpg">
  <link rel="canonical" href="https://lifewithisha.com/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f3efe7;
      --ink: #1b1918;
      --muted: #6d665e;
      --doodle: #ff2bd6;
      --line: #ddd5c8;
    }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #161413; --ink: #f2ede6; --muted: #a59d93; --line: #34302c; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font: 400 17px/1.55 "Inter Tight", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid; place-items: center; padding: 24px 16px;
    }
    main {
      width: min(1080px, 100%);
      display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
      gap: clamp(28px, 5vw, 72px); align-items: center;
    }

    /* Portrait with hand-drawn doodles */
    .portrait { position: relative; aspect-ratio: 1; width: 100%; }
    .portrait img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      border-radius: 6px; filter: contrast(1.02);
      animation: settle .9s ease-out both;
    }
    .portrait svg { position: absolute; inset: -4%; width: 108%; height: 108%; overflow: visible; }
    .doodles path, .doodles circle {
      fill: none; stroke: var(--doodle); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1;
      animation: draw var(--t, .8s) cubic-bezier(.6,.1,.3,1) forwards;
      animation-delay: calc(.5s + var(--d, 0s));
    }
    .doodles .thin { stroke-width: 6.5; }
    .scribble-name {
      font-family: "Permanent Marker", cursive; font-size: 112px; fill: var(--doodle);
      opacity: 0; animation: pop .5s ease-out forwards; animation-delay: 4.1s;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes settle { from { opacity: 0; transform: scale(.97) rotate(-1deg); } to { opacity: 1; transform: none; } }

    /* Text */
    .eyebrow { margin: 0 0 14px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 0; font: 400 clamp(56px, 8vw, 104px)/.95 "Instrument Serif", Georgia, serif; }
    .role { margin: 14px 0 0; font: italic 400 clamp(24px, 2.6vw, 32px)/1.2 "Instrument Serif", Georgia, serif; }
    .soon {
      margin: 28px 0 32px; padding-top: 24px; border-top: 1px solid var(--line);
      color: var(--muted); max-width: 40ch;
    }
    .soon strong { color: var(--ink); font-weight: 500; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; border-radius: 999px;
      font-weight: 500; font-size: 15px; text-decoration: none; color: var(--ink);
      border: 1.5px solid var(--ink); transition: transform .15s ease, background .15s ease, color .15s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-main { background: var(--ink); color: var(--paper); }
    .btn-main:hover { background: var(--doodle); border-color: var(--doodle); color: #fff; }
    .btn:focus-visible { outline: 3px solid var(--doodle); outline-offset: 3px; }

    @media (max-width: 760px) {
      body { place-items: start center; }
      main { grid-template-columns: 1fr; gap: 28px; }
      .portrait { width: min(100%, 440px); margin: 8px auto 0; }
      .text { text-align: center; }
      .soon { margin-left: auto; margin-right: auto; }
      .links { justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .portrait img, .scribble-name { animation: none; opacity: 1; }
      .doodles path, .doodles circle { animation: none; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <main>
    <div class="portrait">
      <img src="assets/coming-soon/isha.jpg" alt="Isha Deo, black and white portrait with hand-drawn pink doodles of coffee, a cat, a pencil, a flower and stars" width="1000" height="1000">
      <svg viewBox="-40 -40 1080 1080" aria-hidden="true">
        <defs>
          <!-- "Boil": redraws the wobble every few frames so the lines feel hand-drawn and alive -->
          <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="n">
              <animate class="boil-anim" attributeName="seed" values="1;3;5;7" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
          </filter>
        </defs>
        <g class="doodles" filter="url(#boil)">
          <!-- swirl over the top -->
          <path pathLength="1" style="--d:0s;--t:1.1s" d="M30 170 C 120 60, 220 150, 320 70 S 520 10, 610 80 S 790 160, 870 70 S 990 50, 1000 120"/>
          <!-- coffee cup with steam -->
          <path pathLength="1" style="--d:.9s" d="M60 430 L200 430 L182 560 Q 130 595 78 560 Z"/>
          <path pathLength="1" style="--d:1.2s;--t:.5s" d="M198 455 C 255 452, 258 525, 186 522"/>
          <path pathLength="1" style="--d:1.35s;--t:.4s" d="M40 600 Q 130 632 220 600"/>
          <path pathLength="1" class="thin" style="--d:1.5s;--t:.6s" d="M105 405 C 82 375, 125 355, 104 325 C 88 300, 120 285, 108 258"/>
          <path pathLength="1" class="thin" style="--d:1.65s;--t:.6s" d="M155 405 C 132 375, 175 355, 154 325 C 138 300, 170 285, 158 258"/>
          <!-- pencil -->
          <path pathLength="1" style="--d:1.9s;--t:.7s" d="M30 690 L205 655 L213 697 L38 732 Z"/>
          <path pathLength="1" style="--d:2.2s;--t:.4s" d="M205 655 L262 672 L213 697"/>
          <path pathLength="1" class="thin" style="--d:2.35s;--t:.3s" d="M70 683 L78 724"/>
          <!-- cat -->
          <path pathLength="1" style="--d:2.5s;--t:1s" d="M70 905 C 58 850, 76 812, 92 798 L 82 740 L 124 780 Q 146 774 168 780 L 210 740 L 200 798 C 220 812, 232 852, 216 905 C 196 952, 92 952, 70 905 Z"/>
          <path pathLength="1" class="thin" style="--d:3.2s;--t:.2s" d="M112 852 L112 866"/>
          <path pathLength="1" class="thin" style="--d:3.25s;--t:.2s" d="M174 852 L174 866"/>
          <path pathLength="1" class="thin" style="--d:3.3s;--t:.25s" d="M133 884 L143 893 L153 884"/>
          <path pathLength="1" class="thin" style="--d:3.4s;--t:.4s" d="M62 884 L14 874 M62 900 L16 908 M224 884 L272 874 M224 900 L270 908"/>
          <!-- star -->
          <path pathLength="1" style="--d:1.1s;--t:.9s" d="M865 175 L887 240 L955 244 L901 287 L923 355 L865 315 L807 355 L829 287 L775 244 L843 240 Z"/>
          <!-- flower -->
          <circle pathLength="1" style="--d:2.1s;--t:.5s" cx="880" cy="535" r="26"/>
          <path pathLength="1" style="--d:2.35s;--t:.9s" d="M880 509 C 845 450, 915 450, 880 509 M906 535 C 965 500, 965 570, 906 535 M880 561 C 915 620, 845 620, 880 561 M854 535 C 795 570, 795 500, 854 535"/>
          <path pathLength="1" style="--d:2.9s;--t:.7s" d="M880 590 C 860 660, 905 720, 878 790"/>
          <path pathLength="1" class="thin" style="--d:3.3s;--t:.4s" d="M884 690 C 930 655, 955 690, 892 712"/>
          <!-- sparkles -->
          <path pathLength="1" class="thin" style="--d:3.5s;--t:.35s" d="M745 60 L745 120 M715 90 L775 90"/>
          <path pathLength="1" class="thin" style="--d:3.6s;--t:.35s" d="M240 220 L240 266 M217 243 L263 243"/>
          <path pathLength="1" class="thin" style="--d:3.7s;--t:.35s" d="M975 840 L975 892 M949 866 L1001 866"/>
          <!-- underline under the name -->
          <path pathLength="1" style="--d:4.5s;--t:.6s" d="M640 1000 C 720 985, 860 990, 990 970"/>
        </g>
        <text class="scribble-name" x="650" y="965" transform="rotate(-6 800 940)" filter="url(#boil)">isha!</text>
      </svg>
    </div>

    <div class="text">
      <p class="eyebrow">lifewithisha.com</p>
      <h1>Isha Deo</h1>
      <p class="role">Copywriter &amp; creative strategist</p>
      <p class="soon"><strong>A new portfolio is brewing.</strong> Reels, campaigns and results from 3+ years and 40+ brands, landing here soon. Until then, say hi or grab my résumé.</p>
      <div class="links">
        <a class="btn btn-main" href="mailto:deoisha278@gmail.com">deoisha278@gmail.com</a>
        <a class="btn" href="https://acrobat.adobe.com/id/urn:aaid:sc:US:94f46cd9-98df-4b9c-b922-6dc4150a30bd" target="_blank" rel="noopener">Résumé ↗</a>
      </div>
    </div>
  </main>
  <script>
    // Respect reduced motion: stop the line wobble too.
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.querySelectorAll('.boil-anim').forEach((a) => a.remove());
    }
  </script>
</body>
</html>
